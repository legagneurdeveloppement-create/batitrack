<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BâtiTrack">
  <defs>
    <linearGradient id="bt-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bt-grad-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="bt-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bt-grad)" filter="url(#bt-shadow)"/>

  <!-- Hard hat icon -->
  <g transform="translate(32 34)" fill="url(#bt-grad-2)">
    <!-- Dome -->
    <path d="M -14 4
             C -14 -8, -7 -16, 0 -16
             C 7 -16, 14 -8, 14 4
             Z"/>
    <!-- Brim -->
    <rect x="-17" y="4" width="34" height="4" rx="2"/>
    <!-- Center ridge -->
    <rect x="-1.4" y="-14" width="2.8" height="18" rx="1.4" opacity="0.65"/>
    <!-- Side ridges -->
    <rect x="-9" y="-10" width="2.2" height="14" rx="1.1" opacity="0.45"/>
    <rect x="6.8" y="-10" width="2.2" height="14" rx="1.1" opacity="0.45"/>
  </g>
</svg>
